services:

  api:
    container_name: pimaster-api

    build:
      context: ./api

    restart: unless-stopped

    ports:
      - "5050:5000"

    environment:
      MINECRAFT_HOST: "pimaster.coeus1.tech"
      MINECRAFT_PORT: "19132"

    volumes:
      - ./database:/app/database
      - ./uploads:/app/uploads


  website:
    container_name: pimaster-website

    image: nginx:latest

    restart: unless-stopped

    ports:
      - "8085:80"

    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./uploads:/usr/share/nginx/uploads:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"
